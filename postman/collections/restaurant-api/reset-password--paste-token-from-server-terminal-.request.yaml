$kind: http-request
name: 'Reset password (paste token from server terminal)'
order: 6000
method: POST
url: '{{baseUrl}}/api/v1/auth/reset-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "PASTE_64_CHARACTER_TOKEN_FROM_THE_RESET_LINK",
      "password": "NewPassword123"
    }
