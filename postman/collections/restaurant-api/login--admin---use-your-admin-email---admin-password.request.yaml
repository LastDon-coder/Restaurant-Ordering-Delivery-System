$kind: http-request
name: 'Login (admin) - use your ADMIN_EMAIL / ADMIN_PASSWORD'
order: 7000
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "YOUR_ADMIN_EMAIL",
      "password": "YOUR_ADMIN_PASSWORD"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body.data && body.data.token) { pm.collectionVariables.set("adminToken", body.data.token); }
