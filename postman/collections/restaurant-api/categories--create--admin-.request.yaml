$kind: http-request
name: 'Categories: create (admin)'
order: 13000
method: POST
url: '{{baseUrl}}/api/v1/categories'
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "category_name": "Desserts",
      "description": "Cakes and ice cream",
      "image_url": "https://example.com/desserts.jpg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body.data && body.data.category) { pm.collectionVariables.set("categoryId", body.data.category.category_id); }
