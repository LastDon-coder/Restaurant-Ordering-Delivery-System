$kind: http-request
name: 'Admin: create staff'
order: 9000
method: POST
url: '{{baseUrl}}/api/v1/users'
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "first_name": "Chidi",
      "last_name": "Staff",
      "email": "staff@example.com",
      "phone": "08011112222",
      "password": "StaffPass123",
      "role": "staff"
    }
